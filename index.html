
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My VALORANT Stream Stats</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: transparent;
  font-family: Arial, sans-serif;
  color: #fff;
}

body {
  padding: 12px;
}

.widget {
  width: 430px;
  max-width: 100%;
  padding: 18px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 15px;
  background: rgba(15,17,25,.88);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 13px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

.brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
}

.tag {
  color: #ffcf80;
  font-size: 9px;
  letter-spacing: 1px;
}

.rank-area {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 0;
}

.emblem {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  border: 1px solid rgba(255,70,85,.5);
  border-radius: 14px;
  color: #ff4655;
  font-size: 35px;
  font-weight: 900;
}

.rank-icon {
  width: 58px;
  height: 58px;
  object-fit: contain;
}

.label {
  color: #aeb5c4;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.rank {
  margin-top: 5px;
  font-size: 27px;
  font-weight: 900;
}

.rr {
  margin-top: 6px;
  font-size: 13px;
}

.rr strong { color: #ff4655; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.stat {
  padding: 12px 10px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  background: rgba(255,255,255,.035);
}

.value {
  margin-top: 7px;
  font-size: 23px;
  font-weight: 800;
}

.note {
  margin-top: 13px;
  color: #aeb5c4;
  font-size: 10px;
  text-align: center;
}

@media (max-width: 360px) {
  .widget { padding: 12px; }
  .rank { font-size: 23px; }
  .value { font-size: 19px; }
}
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="brand">VALORANT // RANKED</div>
    <div class="tag">STREAM STATS</div>
  </div>

  <div class="rank-area">
    <div class="emblem">
      <img
        src="https://media.valorant-api.com/competitivetiers/564d8e28-c226-3180-6285-e48a390db8b1/10/largeicon.png"
        alt="Silver 2 rank"
        class="rank-icon"
      >
    </div>
    <div>
      <div class="label">Current rank</div>
      <div class="rank">SILVER 2</div>
      <div class="rr"><strong>64 RR</strong> / 100</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">Wins</div>
      <div class="value">14</div>
    </div>
    <div class="stat">
      <div class="label">Losses</div>
      <div class="value">10</div>
    </div>
    <div class="stat">
      <div class="label">Win rate</div>
      <div class="value">58.3%</div>
    </div>
  </div>

  <div class="note">
    DEMO DATA — przykładowe dane, nie aktualizują się z gry
  </div>
</div>
</body>
</html>
